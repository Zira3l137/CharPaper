# What cargo-about (run by .github/workflows/build.yml) may find among the app's
# dependencies. A dependency under any other license fails the release build, so a new one
# is looked at before it ships.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
# Only what a download contains: the build passes its own platform, and nothing that only
# builds or tests the app counts.
ignore-build-dependencies = true
ignore-dev-dependencies = true
