#:schema https://raw.githubusercontent.com/Zira3l137/CharPaper/main/schemas/suite.schema.json

# Every key except `schema` is optional. The folder layout already names the
# model, the skins, every clip in `clips/` and every expression in
# `expressions/`; this file only sets what the folders can't say.

schema = 2
name = "Aki"

[timeline]
start = 1
end = 240
fps = 24

[character]
model = "aki.glb"
default_skin = "casual"
default_clip = "idle"

[character.clips.wave]
mode = "once"
label = "Waving"
gaze = false
cues = [{ at = 0.0, sound = "wave_song" }, { at = 0.8, sound = "giggle" }]

[character.clips.sit]
mode = "hold"

[character.expressions.happy]
label = "Happy"

[environment]
default = "room"

[environments.room]
sky_strength = 1.0
shadows = true
exposure = 1.5
sky_rotation_deg = 90.0
background = 0.5
background_blur = 0.3
no_volume_scatter = ["Desk lamp"]
no_shadows = ["Desk lamp"]

# A breeze through the window: the way it blows in the app's axes, Y up.
[environments.room.wind]
direction = [1.0, 0.0, 0.0]
strength = 2.0
gusts = 0.5

[environments.room.actors.Door.clips.slam]
mode = "once"
cues = [{ at = 0.1, sound = "slam" }]

[environments.room.fog.Dust]
color = [0.9, 0.85, 0.8]
density = 0.05
anisotropy = 0.4

[post]
tonemapping = "tony_mc_mapface"
exposure = 0.0
bloom = 0.15
bloom_threshold = 1.0
chromatic_aberration = 0.005

[post.vignette]
intensity = 0.4
size = 1.0
falloff = 2.0

[post.grain]
intensity = 0.04
size = 1.5

[post.grading]
warmth = 0.2
saturation = 1.1

[post.grading.shadows]
lift = 0.01

[post.lut]
name = "teal-orange"
strength = 0.8

[camera]
default = "closeup"
focus = [0.0, 1.0, 0.0]
radius = 2.0
yaw_deg = 0.0
pitch_deg = 10.0
f_stop = 4.0

[cameras.closeup]
f_stop = 2.8
focus_object = "Head"
sensor_height_mm = 20.25

[gaze]
eyes = ["Eye.L", "Eye.R"]
head = "Head"
neck = "Neck"
head_turn = 0.6
eye_yaw_deg = 30.0
eye_pitch_deg = 20.0

[gaze.shape_keys]
left = "EyesLook_Left"
right = "EyesLook_Right"
up = "EyesLook_Up"
down = "EyesLook_Down"

# A click on the head or the hair plays the wave, with the happy face, and slams the room's
# door at the same moment.
[hotspots.Head]
trigger = "click"
expression = "happy"
cooldown = 2.0
areas = [
    { bone = "Head", length = 0.2, radius = 0.12 },
    { bone = "Hair.01", length = 0.15, radius = 0.06 },
]
clips = [{ clip = "wave" }, { actor = "Door", clip = "slam" }]

# The ponytail swings by itself, and keeps out of the head and neck.
[physics.chains."Hair.01"]
bones = ["Hair.01", "Hair.02", "Hair.03"]
length = 0.12
radius = 0.02
stiffness = 0.1
drag = 0.15
gravity = 1.0

[physics.colliders.Head]
bone = "Head"
length = 0.2
radius = 0.09

[physics.colliders.Neck]
bone = "Neck"
length = 0.1
radius = 0.05

# A see-through material Blender draws Blended, not Dithered.
[materials.Visor]
render_method = "blended"
