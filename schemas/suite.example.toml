#:schema https://raw.githubusercontent.com/Zira3l137/CharPaper/main/schemas/suite.schema.json

# Every key except `schema` is optional. The folder layout already names the
# model, the skins and every clip in `animations/`; this file only overrides.

schema = 1
name = "Aki"

[character]
model = "aki.glb"
default_skin = "casual"
default_animation = "idle"

[animations.idle]
file = "animations/locomotion.glb"
clip = "Idle_Breathing"

[animations.wave]
file = "animations/gestures.glb"
clip = "Wave"
mode = "once"

[environment]
default = "room"

[environments.room]
brightness = 1000.0
shadows = true
exposure = 1.5
no_volume_scatter = ["Desk lamp"]

[environments.room.fog.Dust]
color = [0.9, 0.85, 0.8]
density = 0.05
anisotropy = 0.4

[post]
tonemapping = "tony_mc_mapface"
exposure = 0.0
bloom = 0.15
chromatic_aberration = 0.005

[post.vignette]
intensity = 0.4
size = 1.0
falloff = 2.0

[post.grain]
intensity = 0.04
size = 1.5

[camera]
default = "closeup"
focus = [0.0, 1.0, 0.0]
radius = 2.0
yaw_deg = 0.0
pitch_deg = 10.0
f_stop = 4.0

[cameras.closeup]
f_stop = 2.8
focus_object = "Head"
sensor_height_mm = 20.25

[gaze]
eyes = ["Eye.L", "Eye.R"]
head = "Head"
neck = "Neck"
eye_yaw_deg = 30.0
eye_pitch_deg = 20.0

[gaze.shape_keys]
left = "EyesLook_Left"
right = "EyesLook_Right"
up = "EyesLook_Up"
down = "EyesLook_Down"
