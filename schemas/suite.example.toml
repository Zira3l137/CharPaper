#:schema https://raw.githubusercontent.com/Zira3l137/CharPaper/main/schemas/suite.schema.json

# Every key except `schema` is optional. The folder layout already names the
# model, the skins and every clip in `animations/`; this file only overrides.

schema = 1
name = "Aki"

[character]
model = "aki.glb"
default_skin = "casual"
default_animation = "idle"

[animations.idle]
file = "animations/locomotion.glb"
clip = "Idle_Breathing"

[animations.wave]
file = "animations/gestures.glb"
clip = "Wave"
mode = "once"

[environment]
default = "room"

[environments.room]
brightness = 1000.0
shadows = true
exposure = 1.5

[post]
tonemapping = "tony_mc_mapface"
exposure = 0.0
bloom = 0.15

[camera]
default = "closeup"
focus = [0.0, 1.0, 0.0]
radius = 2.0
yaw_deg = 0.0
pitch_deg = 10.0
