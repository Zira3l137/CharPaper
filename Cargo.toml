[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Only what the app uses. tonemapping_luts is required: Camera3d's default tonemapper
# reads its LUT from a ktx2 asset, hence ktx2 and zstd_rust with it.
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "reflect_auto_register",
    "default_font",
    # The panel's text uses the system's UI font, so a translation in any script renders;
    # Bevy's built-in font covers little beyond ASCII.
    "system_font_discovery",

    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",

    "bevy_render",
    "bevy_ui",
    "bevy_ui_render",
    "ui_picking",
    "bevy_picking",
    "bevy_core_pipeline",
    # Bloom, depth of field, chromatic aberration.
    "bevy_post_process",
    # TAA.
    "bevy_anti_alias",
    "bevy_pbr",
    "bevy_camera",
    "bevy_light",
    "bevy_mesh",
    # Without it the glTF loader drops every shape key.
    "morph_animation",
    "bevy_material",
    "bevy_shader",
    "bevy_image",
    "bevy_color",
    "bevy_animation",
    "bevy_gltf",
    # Without it the glTF loader skips animations entirely.
    "gltf_animation",
    "png",
    "tga",

    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
] }
# Only its .ogg loader is used. Playback goes through rodio directly, because Bevy's player
# opens the sound card once and can't reopen it when the device changes.
bevy_audio = { version = "0.19.1", default-features = false, features = ["vorbis"] }
# The version bevy_audio builds.
rodio = { version = "0.22", default-features = false, features = ["playback"] }

raw-window-handle = { version = "0.6", default-features = false, features = ["std"] }
# The version Bevy's renderer builds, for what Bevy doesn't re-export: GPU timestamp queries,
# and `counters`, which makes wgpu count its live objects for the monitor with an atomic add
# each time one is made or dropped.
wgpu = { version = "29", default-features = false, features = ["counters"] }
# The app's allocator. Bevy's render thread allocates and frees many small buffers for every
# view every frame, which mimalloc does faster than the system's allocator and with less
# memory left fragmented.
mimalloc = { version = "0.1.52", default-features = false }
# The process's own CPU and memory use, for the performance monitor.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

clap = { version = "4.6", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

anyhow = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }

serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
# Translations: Fluent files, checked by `fl!` against English while compiling. The default
# `rust-embed` feature is kept because the crate does not build without it.
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
# The version bevy_image builds, plus the two HDR formats Blender saves, and GIF for
# animated materials.
image = { version = "0.25", default-features = false, features = ["hdr", "exr", "gif"] }
# Already built for Bevy. Its receivers are Sync, so they can sit in components.
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
# A subset of what bevy_gltf enables, so the full build compiles it once.
gltf = { version = "1.4", default-features = false, features = ["names", "KHR_lights_punctual", "extras"] }
schemars = { version = "1.2", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

tracing = { version = "0.1", default-features = false, features = ["std"] }

charpaper-audio = { path = "crates/charpaper-audio" }
charpaper-monitor = { path = "crates/charpaper-monitor" }
charpaper-scene = { path = "crates/charpaper-scene" }
charpaper-suite = { path = "crates/charpaper-suite" }
charpaper-bake = { path = "crates/charpaper-bake" }
charpaper-wallpaper = { path = "crates/charpaper-wallpaper" }
charpaper-windows = { path = "crates/charpaper-windows" }
charpaper-ui = { path = "crates/charpaper-ui"}

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

# Baking takes seconds optimised and a minute unoptimised.
[profile.dev.package.charpaper-bake]
opt-level = 3

# Build time is traded for runtime speed everywhere it can be. Fat LTO lets LLVM inline
# across every crate, Bevy's included, which thin LTO only partly does.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# No unwinding tables or landing pads. A panic ends the process either way: Bevy re-raises
# a system's panic on the main thread, and nothing here catches one to recover.
panic = "abort"
strip = true
