
[package]
name = "deskpal"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"

# NOTE: there is deliberately NO `windows` crate dependency here.
# The Win32 functions we need (12 of them) are declared by hand in
# src/platform/win32_sys.rs. Reasons:
#   1. The `windows` crate makes breaking signature changes almost every
#      release (nullable HWND params became Option<HWND> around 0.61, most
#      functions gained Result returns around 0.58). Hand declarations are
#      immune to that churn.
#   2. It pulls in a large metadata-generated dependency for a dozen symbols.
#   3. Declaring them yourself shows exactly what the C ABI is, which is the
#      point of this milestone.

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
