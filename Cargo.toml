[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# `default` is four umbrellas (2d, 3d, ui, audio) covering audio decoding,
# glTF, text, UI, gizmos, picking, scenes, gamepads, clipboard and font
# discovery. A cube on the desktop needs a window, a renderer and PBR.
#
# tonemapping_luts is not optional: Camera3d defaults to TonyMcMapface, whose
# LUT is a ktx2 asset -- hence ktx2 and zstd_rust with it.
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "reflect_auto_register",
    "default_font",

    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",

    "bevy_render",
    "bevy_ui",
    "bevy_ui_render",
    "ui_picking",
    "bevy_picking",
    "bevy_core_pipeline",
    # Bloom.
    "bevy_post_process",
    "bevy_pbr",
    "bevy_camera",
    "bevy_light",
    "bevy_mesh",
    "bevy_material",
    "bevy_shader",
    "bevy_image",
    "bevy_color",
    "bevy_animation",
    "bevy_gltf",
    # Without it the glTF loader skips animations entirely: no clips, and no
    # `Gltf::animations` / `named_animations` fields to find them by.
    "gltf_animation",
    "png",
    "tga",

    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
] }

raw-window-handle = { version = "0.6", default-features = false, features = ["std"] }

clap = { version = "4.6", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

anyhow = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }

serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }
# The version `bevy_macro_utils` already builds, plus writing.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# Same major version and a subset of the features `bevy_gltf` enables, so the
# full build compiles it only once.
gltf = { version = "1.4", default-features = false, features = ["names", "KHR_lights_punctual"] }
schemars = { version = "1.2", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

tracing = { version = "0.1", default-features = false, features = ["std"] }

charpaper-scene = { path = "crates/charpaper-scene" }
charpaper-suite = { path = "crates/charpaper-suite" }
charpaper-wallpaper = { path = "crates/charpaper-wallpaper" }
charpaper-windows = { path = "crates/charpaper-windows" }
charpaper-ui = { path = "crates/charpaper-ui"}

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
