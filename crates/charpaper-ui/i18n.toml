# Read by the `fl!` macro while compiling, to check every message name against English.
fallback_language = "en-US"

[fluent]
assets_dir = "i18n"
# Spelled out because `fl!` otherwise guesses the file name from the package name, and in this
# workspace it gets `charpaper-ui` rather than the `charpaper_ui` the runtime loader uses.
domain = "charpaper_ui"
