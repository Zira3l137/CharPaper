[package]
name = "charpaper-gltf"
version.workspace = true
edition.workspace = true
license.workspace = true

# Bevy-free on purpose: the Blender add-on's Python module builds it, and its tests read what
# it writes back through charpaper-anim, as the app does.
[dependencies]
glam.workspace = true
gltf.workspace = true
# Extras, where Blender keeps shape key names, are raw JSON in gltf-json.
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
charpaper-anim.workspace = true
gltf = { workspace = true, features = ["utils"] }

[lints]
workspace = true
