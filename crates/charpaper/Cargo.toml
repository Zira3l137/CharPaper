[package]
name = "charpaper"
version.workspace = true
edition.workspace = true

[dependencies]
charpaper-audio.workspace = true
charpaper-bake.workspace = true
charpaper-monitor.workspace = true
charpaper-scene.workspace = true
charpaper-settings.workspace = true
charpaper-suite.workspace = true
charpaper-wallpaper.workspace = true
charpaper-ui.workspace = true

anyhow.workspace = true
bevy.workspace = true
clap.workspace = true
mimalloc.workspace = true

[features]
# Streams the time of every system and render pass to the Tracy profiler, for finding what
# exactly is slow. Slows the app down, so only for profiling builds.
profile = ["bevy/trace_tracy"]
# For finding out what goes wrong on some machine: the flags --inspect, and the backend's own,
# such as --strategy and --tree, which users never need and so stay out of the --help they
# see; and the performance monitor's heap and GPU object counts, which cost a little on
# every allocation.
diagnostics = ["charpaper-monitor/diagnostics"]

# Not in a cfg(windows) table: for build dependencies, that would match the machine doing
# the build rather than the target. It does nothing when the target isn't Windows.
[build-dependencies]
embed-resource.workspace = true

[target.'cfg(windows)'.dependencies]
charpaper-windows.workspace = true

# winit needs a display-server backend on Linux. Features are additive, so this widens
# the workspace entry.
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11", "wayland"] }
