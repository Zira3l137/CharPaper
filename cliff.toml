# git-cliff turns the conventional commit history into release notes.
# https://git-cliff.org/docs/configuration

[changelog]
header = "# Changelog\n"
# The HTML comments in group names only set the order of the sections; striptags hides them.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**[breaking]** {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Zira3l137/CharPaper/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Only version tags count, so the rolling `nightly` tag never splits the history.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs?", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^(build|ci)", group = "<!-- 6 -->Build" },
    { message = "^revert", group = "<!-- 7 -->Reverts" },
    { message = "^chore", skip = true },
    { message = "^initial commit$", skip = true },
    { message = ".*", group = "<!-- 8 -->Other" },
]
