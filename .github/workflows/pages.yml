name: Website

# Publishes site/ to GitHub Pages whenever it changes on main, and after every release, which
# starts this workflow when it is done. The folder is the website as it is served, apart from
# the stable download links, which are pointed at the latest release here.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deploy that hasn't started, but never cuts one off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy are separate jobs: in one job the deploy can look for the upload before it
# is visible and fail (actions/deploy-pages#451). Separate, a failed deploy can also be re-run
# on its own, without uploading the site a second time.
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The stable links name the latest release's files, which carry its version. Without a
      # release yet, they stay on the releases page. Pre-releases are never "latest".
      - name: Point the stable downloads at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          echo "latest release: ${tag:-none}"
          if [[ -z $tag ]]; then exit 0; fi
          TAG=$tag python3 - site/index.html <<'EOF'
          import os, re, sys
          tag, path = os.environ["TAG"], sys.argv[1]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          page = open(path, encoding="utf-8").read()
          page, links = re.subn(
              r'href="[^"]*" data-asset="([^"]+)"',
              lambda m: f'href="{base}/{m[1].replace("{tag}", tag)}" data-asset="{m[1]}"',
              page,
          )
          page, labels = re.subn(
              r"<span data-version>[^<]*</span>",
              f"<span data-version>Version {tag.removeprefix('v')}</span>",
              page,
          )
          if not links or labels != links:
              sys.exit(f"expected matching download links and labels, found {links} and {labels}")
          open(path, "w", encoding="utf-8").write(page)
          print(f"{links} links point at {tag}")
          EOF

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
