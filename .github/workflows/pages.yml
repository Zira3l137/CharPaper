name: Website

# Publishes site/ to GitHub Pages whenever it changes on main. Nothing is built: the folder is
# the website as it is served.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deploy that hasn't started, but never cuts one off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy are separate jobs: in one job the deploy can look for the upload before it
# is visible and fail (actions/deploy-pages#451). Separate, a failed deploy can also be re-run
# on its own, without uploading the site a second time.
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
