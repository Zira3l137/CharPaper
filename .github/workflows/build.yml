name: Build

# Not run on its own: nightly.yml and release.yml call it, then publish what it uploads.
on:
  workflow_call:
    inputs:
      label:
        description: Goes into the archive names, e.g. "nightly" or "v0.2.0".
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One entry per platform. A new platform also needs its flags in .cargo/config.toml.
      # Everything in `extras` is copied next to the executable.
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            extras: packaging/windows
          # - name: linux-x64
          #   os: ubuntu-latest
          #   target: x86_64-unknown-linux-gnu
          #   archive: tar.gz
          #   extras: packaging/linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tag builds read main's cache but never write their own, which would only evict it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Only the Bevy-free crates: their tests are quick, and they guard the suite format, the pack
      # and what the add-on's packed export writes.
      - name: Test
        run: cargo test --locked --no-fail-fast --target ${{ matrix.target }} -p charpaper-suite -p charpaper-bake -p charpaper-gaze -p charpaper-update -p charpaper-pack -p charpaper-gltf -p charpaper-anim -p charpaper-drivers

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p charpaper

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9

      # Lists every library built into this platform's app with its license, as MIT and Apache
      # require of a download. Fails on a license packaging/licenses/about.toml doesn't accept.
      - name: Third-party licenses
        run: >
          cargo about generate --locked --fail --target ${{ matrix.target }}
          -c packaging/licenses/about.toml -m crates/charpaper/Cargo.toml
          -o THIRD-PARTY-LICENSES.html packaging/licenses/about.hbs

      - name: Package
        env:
          STAGE: charpaper-${{ inputs.label }}-${{ matrix.name }}
        run: |
          bin=target/${{ matrix.target }}/release/charpaper
          if [[ -f $bin.exe ]]; then bin=$bin.exe; fi
          mkdir -p "dist/$STAGE/characters"
          cp "$bin" "dist/$STAGE/"
          cp -r locales schemas "dist/$STAGE/"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html "dist/$STAGE/"
          cp -r "${{ matrix.extras }}/." "dist/$STAGE/"
          cd dist
          case ${{ matrix.archive }} in
            zip) 7z a -tzip -bso0 "$STAGE.zip" "$STAGE" ;;
            tar.gz) tar -czf "$STAGE.tar.gz" "$STAGE" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  # The add-on's Python module. abi3 makes one wheel per platform fit every Blender's Python.
  wheel:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          # Built in a manylinux_2_28 container: Blender's Linux builds need glibc 2.28 too, so
          # the wheel runs wherever they do.
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            test: true
          # Cross-built on an Apple silicon runner, which can't run it to test it.
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            test: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --locked --out wheels -m crates/charpaper-py/Cargo.toml

      - uses: actions/setup-python@v6
        if: matrix.test
        with:
          python-version: "3.11"

      - name: Test
        if: matrix.test
        run: |
          python -m pip install wheels/*.whl
          python -m unittest discover -v crates/charpaper-py/tests

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: wheels/*.whl
          if-no-files-found: error

  exporter:
    name: Blender exporter
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      # One zip for each platform, with its wheel: Blender refuses a zip made for another.
      - name: Package
        run: python3 packaging/addon_zips.py "${{ inputs.label }}" wheels dist

      - uses: actions/upload-artifact@v7
        with:
          name: exporter
          path: dist/*.zip
          if-no-files-found: error
